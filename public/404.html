<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Página não encontrada · Lumen Store</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: #f6f3ee; color: #1d1b18; font-family: Manrope, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    main { text-align: center; max-width: 480px; }
    .orb {
      width: 96px; height: 96px; margin: 0 auto 28px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f3b79f, #c4532d 60%, #a4411f);
      box-shadow: 0 18px 40px rgba(196, 83, 45, .25);
    }
    .code { font-family: Fraunces, Georgia, serif; font-size: 88px; line-height: 1; letter-spacing: -.04em; color: #c4532d; }
    h1 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 30px; letter-spacing: -.02em; margin: 10px 0 12px; }
    p { color: #6f6a62; font-size: 16px; line-height: 1.6; margin-bottom: 28px; }
    .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    a {
      height: 46px; padding: 0 22px; border-radius: 999px; display: inline-flex; align-items: center;
      font-weight: 700; text-decoration: none; transition: background .15s, border-color .15s;
    }
    .pri { background: #c4532d; color: #fff; }
    .pri:hover { background: #a4411f; }
    .ghost { border: 1px solid #e4ded4; background: #fff; color: #1d1b18; }
    .ghost:hover { border-color: #1d1b18; }
  </style>
</head>
<body>
  <main>
    <div class="orb" aria-hidden="true"></div>
    <div class="code">404</div>
    <h1>Página não encontrada</h1>
    <p>O endereço que você acessou não existe ou foi movido. Que tal voltar para a vitrine e continuar comprando?</p>
    <div class="actions">
      <a class="pri" href="/">Ir para a loja</a>
      <a class="ghost" href="/#pedidos">Meus pedidos</a>
    </div>
  </main>
</body>
</html>
